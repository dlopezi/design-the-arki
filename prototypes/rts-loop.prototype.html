<!doctype html>
<!-- PROTOTYPE, throwaway: does a real-time strategy loop feel right? A build phase, then ONE wave of users per level
     (each level teaches one idea), money that grows by itself and per visit, reputation, and the base as an isometric map
     (like "Your base") that you move over, with C4 zones as plots and connections you draw between buildings.
     Requests travel there and back. Not part of the build and not the real engine: a simple capacity model stands in.
     Open with the dev server at /prototypes/rts-loop.prototype.html. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo: tiempo real</title>
<style>
:root {
  --bg: #04080a; --line: #1f3438; --line-strong: #2f4b51; --fg: #dce8e5; --muted: #8ca5a1; --accent: #3ee0c8;
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --star: #fde047;
  --steel: linear-gradient(180deg, #172629 0%, #0c1517 55%, #091012 100%);
  --bevel: inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.55);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.label { font: 800 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 8px rgba(62,224,200,.35); }
.muted { color: var(--muted); }
.btn { padding: 6px 12px; border: 1px solid var(--line-strong); background: linear-gradient(180deg, #1a2b2f, #0e181a); box-shadow: var(--bevel); border-radius: 2px; font: 800 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.go { background: linear-gradient(180deg, #6ef0a6, #22a35a 60%, #16723f); color: #03140a; border-color: #86efac; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.app { height: 100%; display: grid; grid-template-rows: 52px minmax(0, 1fr) 230px; }

.bar { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--steel); border-bottom: 2px solid var(--line-strong); }
.bar h1 { margin: 0; font: 800 16px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.levels { display: flex; gap: 4px; margin-right: auto; }
.levels .btn { padding: 3px 8px; font-size: 11px; }
.res { display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: #060b0c; border: 1px solid var(--line); font: 800 14px var(--mono); white-space: nowrap; }
.res .money { color: var(--star); font-size: 18px; text-shadow: 0 0 10px rgba(253,224,71,.35); }
.res .rate { font-size: 12px; } .rate.up { color: var(--ok); } .rate.down { color: var(--bad); }
.res .phase { color: var(--accent); }
.rep { width: 110px; height: 10px; background: #0a1112; border: 1px solid var(--line-strong); }
.rep span { display: block; height: 100%; -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 6px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 6px); }

/* The map */
.field { position: relative; overflow: hidden; background: radial-gradient(900px 520px at 55% 45%, #0c1b1d 0%, #05090b 75%); }
#world { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
#world.panning { cursor: grabbing; } #world.linking { cursor: crosshair; }
.hud { position: absolute; z-index: 2; background: var(--steel); border: 1px solid var(--line-strong); box-shadow: var(--bevel); }
.mission { top: 12px; left: 12px; width: 270px; padding: 12px 14px; display: grid; gap: 6px; }
.mission ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.mission li { display: flex; gap: 8px; align-items: center; }
.mission li i { width: 12px; height: 12px; border: 2px solid var(--line-strong); flex: none; }
.mission li.ok i { background: var(--ok); border-color: var(--ok); } .mission li.bad i { background: var(--bad); border-color: var(--bad); }
.lesson { padding: 6px 8px; border-left: 3px solid var(--accent); background: rgba(62,224,200,.07); font-size: 13px; }
.howto { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.howto b { color: var(--fg); }
.c4 { top: 12px; right: 12px; display: flex; align-items: center; gap: 2px; padding: 4px 4px 4px 10px; }
.c4 .label { margin-right: 8px; }
.c4 button { padding: 3px 9px; border: 1px solid transparent; background: none; color: var(--muted); font: 700 11.5px var(--mono); }
.c4 button.on { background: rgba(62,224,200,.16); border-color: var(--accent); color: var(--fg); }
.zoombox { top: 52px; right: 12px; display: flex; gap: 2px; padding: 3px; }
.zoombox button { width: 28px; height: 26px; border: 1px solid var(--line-strong); background: #0b1416; font: 800 14px var(--mono); }
.banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 8px 18px; background: var(--steel); border: 1px solid var(--accent); font: 800 14px var(--mono); letter-spacing: .1em; text-transform: uppercase; z-index: 3; white-space: nowrap; pointer-events: none; }
.banner.warn { border-color: var(--warn); color: var(--warn); } .banner.bad { border-color: var(--bad); color: var(--bad); }
.log { position: absolute; left: 12px; right: 12px; bottom: 8px; display: flex; gap: 6px; overflow: hidden; z-index: 2; font: 12px var(--mono); pointer-events: none; }
.log div { flex: none; padding: 3px 8px; background: rgba(6,11,12,.9); border-left: 2px solid var(--accent); white-space: nowrap; }
.log div.warn { border-left-color: var(--warn); } .log div.bad { border-left-color: var(--bad); } .log div.ok { border-left-color: var(--ok); }

/* SVG world */
.ground { fill: #08110f; }
.ground-grid { stroke: rgba(62,224,200,.05); }
.wall { fill: rgba(10,22,24,.45); stroke: rgba(62,224,200,.35); stroke-width: 3; }
.plot { fill: rgba(62,224,200,.05); stroke: rgba(62,224,200,.35); stroke-dasharray: 8 6; stroke-width: 1.5; }
.site { fill: url(#hatch); stroke: rgba(251,191,36,.45); stroke-dasharray: 10 6; stroke-width: 2; }
.zlabel { fill: var(--accent); font: 800 13px var(--mono); letter-spacing: .12em; }
.zkind { fill: var(--muted); font: 400 11px system-ui; }
.ulabel { fill: var(--fg); font: 800 11px var(--mono); text-anchor: middle; paint-order: stroke; stroke: #05090b; stroke-width: 4px; stroke-linejoin: round; }
.usub { fill: var(--muted); font: 400 10.5px system-ui; text-anchor: middle; paint-order: stroke; stroke: #05090b; stroke-width: 4px; }
.usub.bad { fill: var(--bad); }
.unit { cursor: pointer; }
.unit:hover > svg { filter: brightness(1.18); }
.unit.building > svg { opacity: .5; }
.unit.down > svg { filter: grayscale(1) brightness(.55); }
/* Selected: the building's own base glows in its type's colour. */
.unit.selected > svg > polygon:first-child { stroke: var(--c); stroke-opacity: 1; stroke-width: 2.5; fill: color-mix(in srgb, var(--c) 28%, #111a1e); filter: drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 9px var(--c)); }
.link { stroke: rgba(62,224,200,.55); stroke-width: 3; fill: none; filter: drop-shadow(0 0 3px rgba(62,224,200,.6)); pointer-events: none; }
.link-hit { stroke: transparent; stroke-width: 16; fill: none; cursor: pointer; }
.link.selected { stroke: #fff; }
.link.temp { stroke: var(--warn); stroke-dasharray: 6 6; }
.gate { cursor: crosshair; }
#fx, #temp { pointer-events: none; }
.gate-pad { fill: rgba(62,224,200,.08); stroke: rgba(62,224,200,.6); stroke-width: 2; }

.console { display: grid; grid-template-columns: 360px minmax(0, 1fr) 380px; border-top: 2px solid var(--line-strong); }
.frame { padding: 10px 14px; background: var(--steel); box-shadow: var(--bevel); min-width: 0; overflow: hidden; }
.frame + .frame { border-left: 2px solid var(--line-strong); }
.charts { display: grid; gap: 6px; }
.chart { display: grid; grid-template-columns: 70px 1fr 64px; align-items: center; gap: 8px; font: 700 12px var(--mono); }
.chart svg { width: 100%; height: 34px; display: block; background: #060b0c; border: 1px solid var(--line); }
.chart b { text-align: right; } .chart b.bad { color: var(--bad); }
.econ { margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 12.5px; }
.econ span:nth-child(even) { text-align: right; font-family: var(--mono); }
.inspector { display: grid; gap: 8px; align-content: start; }
.inspector .head { display: flex; gap: 10px; align-items: center; }
.inspector h3 { margin: 0; font: 800 15px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 18px; font-size: 13px; }
.rows span:nth-child(even) { text-align: right; font-family: var(--mono); }
.build { display: grid; gap: 8px; align-content: start; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.card { padding: 4px 2px 0; display: grid; justify-items: center; background: linear-gradient(180deg, #16262a, #0a1214); border: 1px solid var(--line-strong); box-shadow: var(--bevel); border-radius: 2px; position: relative; }
.card:hover:not(:disabled) { border-color: var(--accent); }
.card:disabled { opacity: .35; cursor: default; }
.card .n { font: 700 9.5px var(--mono); text-transform: uppercase; }
.card .c { width: 100%; text-align: center; font: 800 11px var(--mono); color: var(--star); background: #060b0c; margin-top: 2px; }
.card .t { position: absolute; top: 2px; right: 4px; font: 700 9.5px var(--mono); color: var(--muted); }
.card kbd { position: absolute; top: 2px; left: 4px; font: 700 9.5px var(--mono); color: var(--accent); }
.controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.backdrop { position: fixed; inset: 0; background: rgba(2,7,6,.75); display: grid; place-items: center; z-index: 10; }
.end { width: 440px; padding: 24px; background: var(--steel); border: 1px solid var(--line-strong); display: grid; gap: 12px; text-align: center; }
.end h2 { margin: 0; font: 900 24px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.end .stars { font-size: 38px; color: var(--star); letter-spacing: 4px; } .end .stars .off { color: var(--line-strong); }
.proto { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 20; font: 800 10px var(--mono); letter-spacing: .14em; padding: 2px 8px; background: var(--warn); color: #241a00; }
</style>
</head>
<body>
<div class="app">
  <header class="bar" id="bar"></header>
  <main class="field" id="field">
    <svg id="world">
      <defs><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="rgba(251,191,36,.03)"/><rect width="7" height="16" fill="rgba(251,191,36,.07)"/></pattern></defs>
      <g id="cam"><g id="ground"></g><g id="links"></g><g id="units"></g><g id="fx"></g><g id="temp"></g></g>
    </svg>
    <div id="hud"></div>
  </main>
  <footer class="console" id="console"></footer>
</div>
<div id="overlay"></div>
<span class="proto">PROTOTIPO · MODELO SIMPLIFICADO, NO ES EL MOTOR REAL</span>
<script>
// ───────── Numbers ─────────
const TUNE = { passive: 2, per100Visits: 1, upkeepFactor: 100, buildPhase: 30, refund: 0.5 };
const LEVELS = [
  { title: 'Primer pico', lesson: 'Una sola fábrica no basta: necesitas varias y una torre de enlace que reparta el tráfico.',
    allowed: ['loadBalancer', 'appServer', 'database'], start: 150, wave: { rps: 300, length: 45 }, stars: [110, 150] },
  { title: 'Venta flash', lesson: 'Los silos (base de datos) están fijos en tamaño pequeño: pon un generador (caché) delante.',
    allowed: ['loadBalancer', 'appServer', 'cache', 'database'], start: 200, wave: { rps: 420, length: 45 }, stars: [130, 180], noUpgrade: true },
  { title: 'Se cae un servidor', lesson: 'A mitad de la oleada se cae una fábrica. Construye una más de las que necesitas (N+1).',
    allowed: ['loadBalancer', 'appServer', 'database'], start: 220, wave: { rps: 300, length: 50, incidentAt: 20 }, stars: [110, 160] },
];
let level = LEVELS[0];
const P95 = 200, MAX_ERR = 0.01;
const waveFrom = () => TUNE.buildPhase, waveTo = () => TUNE.buildPhase + level.wave.length;

// ───────── Buildings and the rules for connecting them ─────────
const TYPES = {
  loadBalancer: { name: 'Torre de enlace', comp: 'Load balancer', zone: 'edge', color: '#4f8ef7', price: 20, monthly: 20, build: 4, key: '1' },
  appServer: { name: 'Fábrica', comp: 'App server', zone: 'app', color: '#34b97a', price: 40, monthly: 40, build: 5, cap: 200, key: '2' },
  cache: { name: 'Generador', comp: 'Caché', zone: 'data', color: '#f59e0b', price: 30, monthly: 30, build: 6, hit: 0.6, key: '3' },
  database: { name: 'Silos', comp: 'Base de datos', zone: 'data', color: '#9b6bff', price: 50, monthly: 50, build: 8, cap: 400, key: '4' },
};
const DB_UPGRADE = { price: 100, monthly: 100, cap: 800 };
// Who may send requests to whom (as in the game). Connections join component types, like the game's diagram.
const CAN = { users: ['loadBalancer', 'appServer'], loadBalancer: ['appServer'], appServer: ['cache', 'database'], cache: ['database'] };
const NAME = { users: 'Usuarios', ...Object.fromEntries(Object.entries(TYPES).map(([k, v]) => [k, v.name])) };

// The map, in units of the isometric world: zones are diamond plots in a row inside the base wall.
const ZONES = { edge: { name: 'Borde', x: -240, y: 0, w: 120 }, app: { name: 'Aplicación', x: 40, y: 0, w: 175 }, data: { name: 'Datos', x: 340, y: 0, w: 135 } };
const GATE = { x: -520, y: 0 };
const WALL = { x: 50, y: 0, w: 500, h: 250 };
const diamond = (x, y, w, h = w / 2) => `${x - w},${y} ${x},${y - h} ${x + w},${y} ${x},${y + h}`;

function shade(hex, f) { const t = f > 0 ? 255 : 0, k = Math.abs(f); return '#' + [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).map(v => Math.round(v + (t - v) * k).toString(16).padStart(2, '0')).join(''); }
const PT = (pts) => pts.map(p => p.join(',')).join(' ');
function box(cx, cy, w, h, p) { const d = w / 2; return `<g stroke="${p.dark}" stroke-width=".6"><polygon points="${PT([[cx - w, cy], [cx, cy + d], [cx, cy + d - h], [cx - w, cy - h]])}" fill="${p.dark}"/><polygon points="${PT([[cx, cy + d], [cx + w, cy], [cx + w, cy - h], [cx, cy + d - h]])}" fill="${p.base}"/><polygon points="${PT([[cx - w, cy - h], [cx, cy - d - h], [cx + w, cy - h], [cx, cy + d - h]])}" fill="${p.top}"/></g>`; }
function cyl(cx, cy, r, h, p) { const ry = r / 2, top = cy - h; return `<g stroke="${p.dark}" stroke-width=".6"><path d="M${cx - r},${top} L${cx - r},${cy} A${r} ${ry} 0 0 0 ${cx + r},${cy} L${cx + r},${top} Z" fill="${p.base}"/><path d="M${cx - r},${top} L${cx - r},${cy} A${r} ${ry} 0 0 0 ${cx},${cy + ry} L${cx},${top + ry} A${r} ${ry} 0 0 1 ${cx - r},${top} Z" fill="${p.dark}" stroke="none"/><ellipse cx="${cx}" cy="${top}" rx="${r}" ry="${ry}" fill="${p.top}"/></g>`; }
const DRAW = {
  loadBalancer: p => box(32, 48, 14, 6, p) + box(32, 41, 2.5, 26, p) + `<path d="M32 20 L18 27 M32 20 L46 27" stroke="${p.light}" stroke-width="1.4"/><circle cx="32" cy="12" r="6" fill="${p.glow}" opacity=".3"/><circle cx="32" cy="12" r="2.6" fill="${p.glow}"/>`,
  appServer: p => box(29, 47, 17, 15, p) + box(23, 31, 3.5, 10, p) + box(33, 29, 3, 7, p) + box(47, 50, 7, 8, p) + `<polygon points="33,45 37,43 37,39 33,41" fill="#fde68a"/><polygon points="39,42 43,40 43,36 39,38" fill="#fde68a"/>`,
  cache: p => box(32, 50, 16, 7, p) + `<ellipse cx="32" cy="43" rx="9" ry="4.5" fill="${p.glow}" opacity=".55"/><polygon points="32,6 41,22 32,38 23,22" fill="${p.light}"/><polygon points="32,6 41,22 32,38" fill="${p.base}"/><polygon points="32,11 36,22 32,30 28,22" fill="${p.glow}" opacity=".85"/>`,
  database: p => cyl(41, 45, 8, 20, p) + cyl(26, 52, 11, 27, p),
};
function building(type, size, x = 0, y = 0) {
  const c = TYPES[type].color;
  const p = { base: c, light: shade(c, .25), dark: shade(c, -.45), top: shade(c, .45), glow: shade(c, .6) };
  return `<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="0 0 64 64" overflow="visible"><polygon points="4,50 32,36 60,50 32,64" fill="#111a1e" stroke="${c}" stroke-opacity=".55"/>${DRAW[type](p)}</svg>`;
}

// ───────── State ─────────
let S, layer = 3, cam = { x: 0, y: 0, k: 1 }, camSet = false;
function reset(next = level) {
  level = next;
  S = { t: 0, money: level.start, rep: 100, units: [], links: {}, nextId: 1, selected: null, speed: 1, paused: false, over: null,
    hist: [], last: null, log: [], incidentDone: false, waveStarted: false, visits: 0 };
  log(`${level.title}: construye y conecta tu base. Los usuarios llegan en ${TUNE.buildPhase} s.`, 'ok');
  particles.length = 0;
}
function log(text, kind = '') { S.log.unshift({ text: `[${fmt(S.t)}] ${text}`, kind }); S.log = S.log.slice(0, 6); }
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const ready = (type) => S.units.filter(u => u.type === type && u.ready && !u.down);
const upkeepPerS = () => S.units.reduce((sum, u) => sum + (u.upgraded ? DB_UPGRADE.monthly : TYPES[u.type].monthly), 0) / TUNE.upkeepFactor;
const inWave = () => S.t >= waveFrom() && S.t < waveTo();

function buildUnit(type) {
  const spec = TYPES[type];
  if (S.over || S.money < spec.price || !level.allowed.includes(type)) return;
  S.money -= spec.price;
  const count = S.units.filter(u => u.type === type).length + 1;
  const id = S.nextId++;
  S.units.push({ id, type, label: type === 'appServer' ? `app-${count}` : spec.comp, left: spec.build, total: spec.build, ready: false, down: false, upgraded: false });
  S.selected = { unit: id };
  if (layer === 1) layer = 3;
  log(`Construyendo ${spec.name} (${spec.build} s)`);
  renderAll();
}
function removeUnit(id) {
  const u = S.units.find(x => x.id === id); if (!u) return;
  const back = Math.round(TYPES[u.type].price * TUNE.refund);
  S.money += back; S.units = S.units.filter(x => x.id !== id); S.selected = null;
  if (!S.units.some(x => x.type === u.type)) for (const [from, to] of Object.entries(S.links)) if (from === u.type || to === u.type) delete S.links[from];
  log(`${TYPES[u.type].name} quitado: +$${back}`); renderAll();
}
function connect(from, to) {
  if (from === to) return;
  if (!(CAN[from] ?? []).includes(to)) { log(`No se puede conectar ${NAME[from]} → ${NAME[to]}`, 'bad'); renderAll(); return; }
  S.links[from] = to; S.selected = { link: from };
  log(`Conectado: ${NAME[from]} → ${NAME[to]}`, 'ok'); renderAll();
}
function upgradeDb(id) {
  const u = S.units.find(x => x.id === id);
  if (!u || u.upgraded || level.noUpgrade || S.money < DB_UPGRADE.price) return;
  S.money -= DB_UPGRADE.price; u.upgraded = true; u.ready = false; u.left = u.total = 6;
  log('Mejorando los silos a tier Medium (6 s)', 'warn'); renderAll();
}
function callNow() {
  if (S.t >= TUNE.buildPhase) return;
  const bonus = Math.round((TUNE.buildPhase - S.t) * TUNE.passive * 2);
  S.money += bonus; S.t = TUNE.buildPhase;
  log(`¡Que vengan ya! Bonus +$${bonus}`, 'ok'); renderAll();
}

// ───────── Simplified capacity model, following the player's connections ─────────
function chain() { const out = []; let cur = S.links.users; while (cur && !out.includes(cur)) { out.push(cur); cur = S.links[cur]; } return out; }
function flowModel(rps) {
  const c = chain(), lb = ready('loadBalancer')[0], apps = ready('appServer'), db = ready('database')[0], cache = ready('cache')[0];
  const ai = c.indexOf('appServer');
  const viaLb = c[0] === 'loadBalancer' && ai === 1 && !!lb;
  const reached = ai === 0 || viaLb;
  const usableApps = !reached ? 0 : viaLb ? apps.length : Math.min(1, apps.length); // without a load balancer only one factory gets traffic
  const after = ai < 0 ? [] : c.slice(ai + 1);
  const cacheOn = after[0] === 'cache' && !!cache;
  const dbOn = !!db && (after[0] === 'database' || (after[0] === 'cache' && after[1] === 'database'));
  const appCap = usableApps * TYPES.appServer.cap, dbCap = dbOn ? (db.upgraded ? DB_UPGRADE.cap : TYPES.database.cap) : 0;
  const hit = cacheOn ? TYPES.cache.hit : 0;
  const byApps = Math.min(rps, appCap), toDb = byApps * (1 - hit), byDb = Math.min(toDb, dbCap);
  const served = after.length ? byApps * hit + byDb : 0;
  const rhoApp = appCap ? Math.min(byApps / appCap, .97) : 1, rhoDb = dbCap ? Math.min(toDb / dbCap, .97) : 1;
  const p95 = rps ? Math.min(2000, Math.round((20 / (1 - rhoApp)) * 1.4 + (1 - hit) * (20 / (1 - rhoDb)) * 1.4 + (hit ? 2 : 0))) : 0;
  const problem = !S.links.users ? 'Conecta a los usuarios con tu base' : !reached ? 'Las peticiones no llegan a ninguna fábrica'
    : !after.length ? 'Las fábricas no envían a ningún sitio' : !dbOn ? 'Falta conectar los silos (base de datos)' : null;
  return { rps, served, errors: rps ? (rps - served) / rps : 0, p95, rhoApp, rhoDb, hit, cacheOn, dbOn, viaLb, usableApps,

  if (running && L?.rps) {
    spawnDebt += (L.rps / 30) * dt * S.speed;
    const spots = layout();
    while (spawnDebt >= 1 && particles.length < 300) { spawnDebt--; spawn(routeFor(spots, L)); }
  }
  let out = '';
  for (const p of particles) {
    if (running) for (let k = 0; k < Math.min(S.speed, 4); k++) advance(p, dt);
    if (p.dead && p.kind === 'req') { bounce(p); p.kind = 'gone'; }
    const a = p.pts[p.seg], b = p.pts[p.seg + 1] ?? a;
    const x = a.x + (b.x - a.x) * p.f, y = a.y + (b.y - a.y) * p.f + (p.kind === 'req' ? -5 : 5);
    const color = p.kind === 'reply' ? '#4ade80' : p.kind === 'error' ? '#f87171' : '#7ff5e5';
    if (p.kind !== 'gone') out += `<rect x="${(x - 3.5).toFixed(1)}" y="${(y - 3.5).toFixed(1)}" width="7" height="7" fill="${color}" opacity="${Math.max(0, p.life).toFixed(2)}" style="filter:drop-shadow(0 0 4px ${color})"/>`;
    if (p.kind === 'error' && p.seg === 0 && p.f < .25) out += `<text x="${x + 6}" y="${y - 4}" fill="#f87171" font-family="ui-monospace" font-size="11" font-weight="800">503</text>`;
  }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0 || particles[i].kind === 'gone') particles.splice(i, 1);
  $('fx').innerHTML = out;
  requestAnimationFrame(animate);
}

// ───────── Map input: pan, zoom, select, connect ─────────
const world = $('world');
let drag = null;
const toWorld = (e) => { const r = world.getBoundingClientRect(); return { x: (e.clientX - r.left - cam.x) / cam.k, y: (e.clientY - r.top - cam.y) / cam.k }; };
world.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  camSet = true;
  world.setPointerCapture(e.pointerId);
  const node = e.target.closest('[data-type]'), link = e.target.closest('[data-link]');
  if (link) { S.selected = { link: link.dataset.link }; renderAll(); return; }
  if (node && (node.dataset.type === 'users' || CAN[node.dataset.type])) drag = { kind: 'link', from: node.dataset.type, unit: node.dataset.unit, sx: e.clientX, sy: e.clientY, start: toWorld(e) };
  else if (node) drag = { kind: 'select', unit: node.dataset.unit, sx: e.clientX, sy: e.clientY };
  else drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
});
world.addEventListener('pointermove', e => {
  if (!drag) return;
  const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 5;
  if (drag.kind === 'pan') { if (moved) drag.moved = true; cam.x = drag.cx + e.clientX - drag.sx; cam.y = drag.cy + e.clientY - drag.sy; applyCam(); world.classList.add('panning'); }
  if (drag.kind === 'link' && moved) {
    drag.linking = true; world.classList.add('linking');
    const p = toWorld(e);
    $('temp').innerHTML = `<line class="link temp" x1="${drag.start.x}" y1="${drag.start.y}" x2="${p.x}" y2="${p.y}"/>`;
  }
});
world.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null; world.classList.remove('panning', 'linking'); $('temp').innerHTML = '';
  if (d.kind === 'link' && d.linking) {
    world.releasePointerCapture(e.pointerId);
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-type]');
    if (target && target.dataset.type !== 'users') connect(d.from, target.dataset.type);
    return;
  }
  if (d.kind === 'pan' && !d.moved) { S.selected = null; renderAll(); return; }
  if ((d.kind === 'link' || d.kind === 'select') && d.unit) { S.selected = { unit: Number(d.unit) }; renderAll(); }
});
world.addEventListener('wheel', e => {
  e.preventDefault(); camSet = true;
  const r = world.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.min(2.2, Math.max(.35, cam.k * (e.deltaY < 0 ? 1.1 : .9)));
  cam.x = mx - (mx - cam.x) * (k / cam.k); cam.y = my - (my - cam.y) * (k / cam.k); cam.k = k; applyCam();
}, { passive: false });

// Buttons around the map
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('#world')) return;
  const el = e.target.closest('button'); if (!el) return;
  if (el.dataset.build) buildUnit(el.dataset.build);
  else if (el.dataset.level) { reset(LEVELS[Number(el.dataset.level)]); renderAll(); }
  else if (el.dataset.layer) { layer = Number(el.dataset.layer); particles.length = 0; renderAll(); }
  else if (el.dataset.zoom) { const r = world.getBoundingClientRect(), k = Math.min(2.2, Math.max(.35, cam.k * Number(el.dataset.zoom))); cam.x = r.width / 2 - (r.width / 2 - cam.x) * (k / cam.k); cam.y = r.height / 2 - (r.height / 2 - cam.y) * (k / cam.k); cam.k = k; camSet = true; applyCam(); }
  else if (el.dataset.act === 'fit') { camSet = false; fitCam(); }
  else if (el.dataset.unlink) { delete S.links[el.dataset.unlink]; S.selected = null; log('Conexión quitada'); renderAll(); }
  else if (el.dataset.remove) removeUnit(Number(el.dataset.remove));
  else if (el.dataset.upgrade) upgradeDb(Number(el.dataset.upgrade));
  else if (el.dataset.speed) { S.speed = Number(el.dataset.speed); renderHud(); }
  else if (el.dataset.act === 'call') callNow();
  else if (el.dataset.act === 'pause') { S.paused = !S.paused; renderHud(); }
  else if (el.dataset.act === 'restart') { reset(); renderAll(); }
});
document.addEventListener('keydown', e => {
  const t = Object.entries(TYPES).find(([, v]) => v.key === e.key); if (t) buildUnit(t[0]);
  if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; renderHud(); }
  if (e.key === 'Escape') { S.selected = null; renderAll(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.selected?.link) { delete S.links[S.selected.link]; S.selected = null; log('Conexión quitada'); renderAll(); }
});
addEventListener('resize', () => { if (!camSet) fitCam(); });

reset(); fitCam(); renderAll(); requestAnimationFrame(animate);
let lastFrame = performance.now();
setInterval(() => {
  const now = performance.now(), real = Math.min(0.25, (now - lastFrame) / 1000); lastFrame = now;
  if (S.over || S.paused) { if (S.over && !$('overlay').innerHTML) renderHud(); return; }
  const sim = real * S.speed, n = Math.ceil(sim / 0.1);
  for (let i = 0; i < n; i++) step(sim / n);
  if (!drag) renderWorld();
  renderHud();
}, 100);
</script>
</body>
</html>
