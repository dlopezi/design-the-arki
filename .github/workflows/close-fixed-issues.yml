name: Close fixed issues

# GitHub closes an Issue from "Fixes #N" only when the Pull Request is merged into the default branch (main).
# Features are merged into develop, so this closes those Issues when a Pull Request is merged there.

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close each Issue named by Fixes / Closes / Resolves #N
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          for n in $(printf '%s' "$BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' | grep -oE '[0-9]+$' | sort -u); do
            if [ "$(gh issue view "$n" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
              gh issue close "$n" --reason completed --comment "Done in #$PR (merged into develop)."
            fi
          done
