name: Bug
description: Something in the game does not work as expected.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Bottom right of the title screen (for example v1.0.0).
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Chrome
  - type: input
    id: level
    attributes:
      label: Level and mode
      placeholder: Level 4 Flash sale, Normal
