name: Idea
description: An improvement or a new thing for the game.
labels: [idea, needs-triage]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you change or add, and why?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Bottom right of the title screen (for example v1.0.0).
      placeholder: v1.0.0
